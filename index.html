<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sunrise Realtor - Plot Layout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fdf6e3;
            margin: 0;
            padding: 0;
        }

        header {
            background: #c8ee0cd4;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        svg {
            display: block;
            margin: 20px auto;
            border: 2px solid #333;
            background: #fdf6e3;
            max-width: 95%;
            height: auto;
            cursor: grab;
            touch-action: none;
        }

        svg.dragging {
            cursor: grabbing;
        }

        footer {
            text-align: center;
            padding: 1rem;
            background: #eee;
            font-size: 0.9rem;
        }

        .legend {
            text-align: center;
            margin: 10px;
        }

        .legend span {
            display: inline-block;
            margin: 0 15px;
            font-weight: bold;
        }

        .legend .available {
            color: #16A34A;
        }

        .legend .sold {
            color: #F97316;
        }

        .search-bar {
            max-width: 400px;
            margin: 0 auto 10px;
            padding: 0 20px;
        }

        .search-bar input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-family: Arial, sans-serif;
        }

        .search-bar input:focus {
            border-color: #16A34A;
        }

        .plot-panel {
            position: fixed;
            top: 90px;
            right: 20px;
            width: 300px;
            max-height: calc(100vh - 110px);
            overflow-y: auto;
            background: #fff;
            border-left: 4px solid #16A34A;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            padding: 20px;
            font-family: Arial, sans-serif;
            transition: transform 0.2s ease, opacity 0.2s ease;
            z-index: 100;
        }

        .plot-panel.sold {
            border-left-color: #F97316;
        }

        .plot-panel.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(20px);
        }

        .plot-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .plot-panel-header span {
            font-size: 1.3rem;
            font-weight: bold;
            color: #16A34A;
        }

        .plot-panel.sold .plot-panel-header span {
            color: #F97316;
        }

        .plot-panel-header button {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: #999;
            line-height: 1;
        }

        .plot-panel-status {
            display: inline-block;
            margin-bottom: 10px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .plot-panel-status.available {
            background: #DCFCE7;
            color: #16A34A;
        }

        .plot-panel-status.sold {
            background: #FED7AA;
            color: #C2410C;
        }

        .plot-panel-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #ddd;
            font-size: 0.95rem;
        }

        .plot-panel-dims-label {
            margin: 14px 0 8px;
            color: #888;
            font-size: 0.9rem;
        }

        .plot-panel-dims {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .plot-panel-dim {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .plot-panel-dim .label {
            color: #888;
            font-size: 0.8rem;
        }

        .plot-panel-dim .value {
            color: #16A34A;
            font-weight: bold;
            font-size: 1.05rem;
        }

        @media (max-width: 900px) {
            .plot-panel {
                position: fixed;
                left: 10px;
                right: 10px;
                width: auto;
                bottom: 10px;
                top: auto;
                max-height: 60vh;
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 0.6rem 1rem;
            }

            header h1 {
                font-size: 1.3rem;
                margin: 0 0 4px;
            }

            header p {
                font-size: 0.85rem;
                margin: 0;
            }

            .legend {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 6px 10px;
                margin: 8px 6px;
            }

            .legend span {
                margin: 0;
                font-size: 0.78rem;
            }

            .search-bar {
                padding: 0 12px;
            }

            .search-bar input {
                padding: 10px 14px;
                font-size: 0.95rem;
            }

            svg {
                border-width: 1px;
                margin: 10px auto;
            }

            .plot-panel-dims {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .plot-panel-dim .value {
                font-size: 0.95rem;
            }
        }
    </style>

         scaled to match that viewBox's real-world-inch coordinate system -->
</head>

        <style id="style1">
            .plot-boundary {
                stroke: #000;
                stroke-width: 35;
                stroke-linejoin: round;
                cursor: pointer;
                transition: fill 0.15s ease;
            }

            /* Status colouring: green = available, orange = sold.
               Every plot gets one of these two classes (see the
               `soldPlotIds` list in the script at the bottom to mark a
               plot as sold). */
            .plot-boundary.available {
                fill: #DCFCE7;
            }

            .plot-boundary.available:hover {
                fill: #BBF7D0;
            }

            .plot-boundary.sold {
                fill: #FED7AA;
            }

            .plot-boundary.sold:hover {
                fill: #FDBA74;
            }

            /* click-to-reveal-dimensions highlight always wins over status
               color, even while still hovered (hence !important -- a plain
               .active rule has lower specificity than .sold:hover) */
            .plot-boundary.active {
                fill: #FDE68A !important;
            }

            /* Category colouring — a coloured border layered on top of the
               sold/available fill, so a plot's status colour still shows.
               EB / LB / PARK are applied directly via their data-plot value;
               corner plots are applied by the `cornerPlotIds` list in the
               script at the bottom. */
            .plot-boundary.eb {
                stroke: #2563EB;
                stroke-width: 70;
            }

            .plot-boundary.lb {
                stroke: #9333EA;
                stroke-width: 70;
            }

            .plot-boundary.park {
                stroke: #059669;
                stroke-width: 70;
            }

            .plot-boundary.corner {
                stroke: #DB2777;
                stroke-width: 70;
            }

            /* Fill tints — only applied while a plot is still available, so
               a sold plot (no .available class) always stays orange. This
               makes each category visually distinct at a glance, not just
               on hover/click. */
            .plot-boundary.eb.available {
                fill: #BFDBFE;
            }

            .plot-boundary.eb.available:hover {
                fill: #93C5FD;
            }

            .plot-boundary.lb.available {
                fill: #E9D5FF;
            }

            .plot-boundary.lb.available:hover {
                fill: #D8B4FE;
            }

            .plot-boundary.park.available {
                fill: #A7F3D0;
            }

            .plot-boundary.park.available:hover {
                fill: #6EE7B7;
            }

            .plot-boundary.corner.available {
                fill: #FBCFE8;
            }

            .plot-boundary.corner.available:hover {
                fill: #F9A8D4;
            }

            .plot-dim {
                font-size: 105px;
                fill: #0d00ff;
                font-family: Arial;
                font-weight: bold;
                text-anchor: middle;
                dominant-baseline: middle;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.15s ease;
            }

            .plot-dim.active {
                opacity: 1;
            }

                fill: #FF0000;
                font-family: Arial;
                font-weight: bold;
                text-anchor: middle;
                dominant-baseline: middle;
                pointer-events: none;
            }

        <text x="-30418.486" y="8808.7031" style="font-size:300px;font-family:Arial;text-anchor:middle;fill:#1E293B"
            transform="rotate(-0.373161)" id="roadtext_dim12-5">

    <!-- Script placed at the very end -->
    <script>
        const svg = document.getElementById('mysvg');
        let viewBox = { x: -51000, y: -8000, w: 56000, h: 50000 };

        // ------------------------------------------------------------------
        // SOLD PLOTS
        // ------------------------------------------------------------------
        const soldPlotIds = [];
        soldPlotIds.forEach(id => {
            const boundary = document.getElementById(`plot${id}_boundary`);
            if (!boundary) {
                console.warn(`soldPlotIds: no plot found with id ${id}`);
                return;
            }
            boundary.classList.remove('available');
            boundary.classList.add('sold');
        });
        // ------------------------------------------------------------------

        // ------------------------------------------------------------------
        // CORNER PLOTS
        // Add plot numbers here (e.g. [4, 17, 25]) to give them the pink
        // "corner" border colour defined in the <style> block above.
        // ------------------------------------------------------------------
        const cornerPlotIds = [];
        cornerPlotIds.forEach(id => {
            const boundary = document.getElementById(`plot${id}_boundary`);
            if (!boundary) {
                console.warn(`cornerPlotIds: no plot found with id ${id}`);
                return;
            }
            boundary.classList.add('corner');
        });
        // ------------------------------------------------------------------

        // --- PAN + ZOOM (unchanged) ---
        let state = {
            scale: 1,
            panX: viewBox.x,
            panY: viewBox.y,
            isDragging: false,
            startX: 0,
            startY: 0
        };
        const originalViewBox = { x: viewBox.x, y: viewBox.y, width: viewBox.w, height: viewBox.h };

        function updateTransform() {
            svg.setAttribute(
                'viewBox',
                `${state.panX} ${state.panY} ${originalViewBox.width / state.scale} ${originalViewBox.height / state.scale}`
            );
        }

        svg.addEventListener('wheel', e => {
            e.preventDefault();
            const rect = svg.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const svgMouseX = state.panX + (mouseX / rect.width) * (originalViewBox.width / state.scale);
            const svgMouseY = state.panY + (mouseY / rect.height) * (originalViewBox.height / state.scale);
            const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
            const newScale = Math.max(0.5, Math.min(8, state.scale * zoomFactor));
            state.panX = svgMouseX - (mouseX / rect.width) * (originalViewBox.width / newScale);
            state.panY = svgMouseY - (mouseY / rect.height) * (originalViewBox.height / newScale);
            state.scale = newScale;
            updateTransform();
        }, { passive: false });

        svg.addEventListener('mousedown', e => {
            state.isDragging = true;
            state.startX = e.clientX;
            state.startY = e.clientY;
            svg.classList.add('dragging');
        });
        window.addEventListener('mouseup', () => {
            state.isDragging = false;
            svg.classList.remove('dragging');
        });
        window.addEventListener('mousemove', e => {
            if (!state.isDragging) return;
            const dx = e.clientX - state.startX;
            const dy = e.clientY - state.startY;
            const rect = svg.getBoundingClientRect();
            const svgDx = -(dx / rect.width) * (originalViewBox.width / state.scale);
            const svgDy = -(dy / rect.height) * (originalViewBox.height / state.scale);
            state.panX += svgDx;
            state.panY += svgDy;
            state.startX = e.clientX;
            state.startY = e.clientY;
            updateTransform();
        });

        // ------------------------------------------------------------------
        // TOUCH SUPPORT (mobile) — one finger pans, two fingers pinch-zoom.
        // Mirrors the mouse/wheel logic above using the same `state` object.
        // ------------------------------------------------------------------
        function touchDist(t0, t1) {
            return Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
        }
        function touchMid(t0, t1) {
            return { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
        }

        let pinchStartDist = 0;
        let pinchStartScale = 1;

        svg.addEventListener('touchstart', e => {
            if (e.touches.length === 1) {
                state.isDragging = true;
                state.startX = e.touches[0].clientX;
                state.startY = e.touches[0].clientY;
                svg.classList.add('dragging');
            } else if (e.touches.length === 2) {
                state.isDragging = false;
                svg.classList.remove('dragging');
                pinchStartDist = touchDist(e.touches[0], e.touches[1]);
                pinchStartScale = state.scale;
            }
        }, { passive: false });

        svg.addEventListener('touchmove', e => {
            e.preventDefault();
            const rect = svg.getBoundingClientRect();

            if (e.touches.length === 1 && state.isDragging) {
                const dx = e.touches[0].clientX - state.startX;
                const dy = e.touches[0].clientY - state.startY;
                const svgDx = -(dx / rect.width) * (originalViewBox.width / state.scale);
                const svgDy = -(dy / rect.height) * (originalViewBox.height / state.scale);
                state.panX += svgDx;
                state.panY += svgDy;
                state.startX = e.touches[0].clientX;
                state.startY = e.touches[0].clientY;
                updateTransform();
            } else if (e.touches.length === 2) {
                const newDist = touchDist(e.touches[0], e.touches[1]);
                if (pinchStartDist === 0) return;
                const mid = touchMid(e.touches[0], e.touches[1]);
                const midX = mid.x - rect.left;
                const midY = mid.y - rect.top;
                const svgMidX = state.panX + (midX / rect.width) * (originalViewBox.width / state.scale);
                const svgMidY = state.panY + (midY / rect.height) * (originalViewBox.height / state.scale);

                const newScale = Math.max(0.5, Math.min(8, pinchStartScale * (newDist / pinchStartDist)));
                state.panX = svgMidX - (midX / rect.width) * (originalViewBox.width / newScale);
                state.panY = svgMidY - (midY / rect.height) * (originalViewBox.height / newScale);
                state.scale = newScale;
                updateTransform();
            }
        }, { passive: false });

        svg.addEventListener('touchend', e => {
            state.isDragging = false;
            svg.classList.remove('dragging');
            pinchStartDist = 0;
            if (e.touches.length === 1) {
                // one finger still down after lifting the other — resume panning
                state.isDragging = true;
                state.startX = e.touches[0].clientX;
                state.startY = e.touches[0].clientY;
                svg.classList.add('dragging');
            }
        });

        // ------------------------------------------------------------------
        // NEW-LAYER LABEL ALIGNMENT (only touches ploteb, plotlb, plotpark, plotpark-1)
        // ------------------------------------------------------------------
        function alignPlotDimensions(offsetDistance = 200) {
            const newPlotIds = ['ploteb', 'plotlb', 'plotpark', 'plotpark-1'];

            newPlotIds.forEach(groupId => {
                const group = document.getElementById(groupId);
                if (!group) return;

                const boundaries = group.querySelectorAll('.plot-boundary');
                const dimLabels = group.querySelectorAll('.plot-dim');
                if (!boundaries.length) return;

                function parsePoints(d) {
                    const points = [];
                    const cmds = d.match(/[ML]\s*-?\d+\.?\d*,-?\d+\.?\d*/g) || [];
                    cmds.forEach(cmd => {
                        const [x, y] = cmd.replace(/[ML]/, '').trim().split(',').map(Number);
                        points.push({ x, y });
                    });
                    return points;
                }

                let allPoints = [];
                boundaries.forEach(b => allPoints = allPoints.concat(parsePoints(b.getAttribute('d'))));

                // Drop duplicate closing point (last === first)
                if (allPoints.length > 1) {
                    const first = allPoints[0], last = allPoints[allPoints.length - 1];
                    if (Math.abs(first.x - last.x) < 0.01 && Math.abs(first.y - last.y) < 0.01) {
                        allPoints.pop();
                    }
                }
                const n = allPoints.length;

                const cx = allPoints.reduce((s, p) => s + p.x, 0) / n;
                const cy = allPoints.reduce((s, p) => s + p.y, 0) / n;

                // edge[0] = closing edge (last point -> first point), matching how
                // labels A, B, C... were originally authored on these plots
                const edges = [];
                for (let i = 0; i < n; i++) {
                    const p1 = allPoints[(i - 1 + n) % n];
                    const p2 = allPoints[i];
                    edges.push([p1, p2]);
                }

                dimLabels.forEach((label, i) => {
                    const edge = edges[i];
                    if (!edge) return;
                    const [p1, p2] = edge;

                    // Clear any x/y on child tspans so they inherit the parent <text>
                    // position instead of overriding it
                    label.querySelectorAll('tspan').forEach(tspan => {
                        tspan.removeAttribute('x');
                        tspan.removeAttribute('y');
                    });

                    const mx = (p1.x + p2.x) / 2;
                    const my = (p1.y + p2.y) / 2;
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const len = Math.hypot(dx, dy);

                    let nx = -dy / len;
                    let ny = dx / len;
                    const towardCentroid = (cx - mx) * nx + (cy - my) * ny;
                    if (towardCentroid < 0) { nx = -nx; ny = -ny; } // point INWARD

                    const labelX = mx + nx * offsetDistance;
                    const labelY = my + ny * offsetDistance;

                    let angle = Math.atan2(dy, dx) * 180 / Math.PI;
                    if (angle > 90) angle -= 180;
                    if (angle < -90) angle += 180;

                    label.setAttribute('x', labelX.toFixed(3));
                    label.setAttribute('y', labelY.toFixed(3));
                    if (Math.abs(angle) > 0.5) {
                        label.setAttribute('transform', `rotate(${angle.toFixed(3)},${labelX.toFixed(3)},${labelY.toFixed(3)})`);
                    } else {
                        label.removeAttribute('transform');
                    }
                });

                group.querySelectorAll('.plot-name, .plot-number').forEach(label => {
                    label.querySelectorAll('tspan').forEach(tspan => {
                        tspan.removeAttribute('x');
                        tspan.removeAttribute('y');
                    });
                    label.setAttribute('x', cx.toFixed(3));
                    label.setAttribute('y', cy.toFixed(3));
                    label.removeAttribute('transform');
                });
            });
        }

        alignPlotDimensions(150);
        // ------------------------------------------------------------------

        // ------------------------------------------------------------------
        // SIDE PANEL — shows plot details on click (works for every plot,
        // old and new, since it keys off data-plot + the SVG's own data
        // attributes rather than a hardcoded list of ids)
        // ------------------------------------------------------------------

        // Your SVG coordinates are drawn at 96 units per inch (confirmed from
        // existing data-length-ft/data-length-units pairs, e.g. 35ft = 1587.4016
        // units -> 1587.4016 / 35 = 45.35433... units per foot).
        const UNITS_PER_FOOT = 1152 / 25.4;

        function parsePathPoints(d) {
            const points = [];
            const cmds = d.match(/[ML]\s*-?\d+\.?\d*,-?\d+\.?\d*/g) || [];
            cmds.forEach(cmd => {
                const [x, y] = cmd.replace(/[ML]/, '').trim().split(',').map(Number);
                points.push({ x, y });
            });
            return points;
        }

        // Shoelace formula, summed across every boundary path in the group
        // (handles multi-path plots like PARK which has 2 boundary pieces)
        function calcPlotAreaSqFt(plotGroup) {
            let totalAreaUnits = 0;
            plotGroup.querySelectorAll('.plot-boundary').forEach(boundary => {
                const pts = parsePathPoints(boundary.getAttribute('d'));
                if (pts.length < 3) return;
                let area = 0;
                for (let i = 0; i < pts.length; i++) {
                    const p1 = pts[i];
                    const p2 = pts[(i + 1) % pts.length];
                    area += (p1.x * p2.y - p2.x * p1.y);
                }
                totalAreaUnits += Math.abs(area / 2);
            });
            const areaSqFt = totalAreaUnits / (UNITS_PER_FOOT * UNITS_PER_FOOT);
            return areaSqFt;
        }

        function formatNumber(n) {
            return Math.round(n).toLocaleString('en-US');
        }

        const panel = document.getElementById('plot-panel');
        const ppTitle = document.getElementById('pp-title');
        const ppStatus = document.getElementById('pp-status');
        const ppArea = document.getElementById('pp-area');
        const ppDims = document.getElementById('pp-dims');

        function showPlotPanel(plotId, plotGroup) {
            const boundary = plotGroup.querySelector('.plot-boundary');
            const isSold = boundary ? boundary.classList.contains('sold') : false;

            ppTitle.textContent = `Plot ${plotId.toUpperCase()}`;
            panel.classList.toggle('sold', isSold);
            ppStatus.textContent = isSold ? 'Sold' : 'Available';
            ppStatus.className = 'plot-panel-status ' + (isSold ? 'sold' : 'available');

            const areaSqFt = calcPlotAreaSqFt(plotGroup);
            ppArea.textContent = areaSqFt > 0 ? `${formatNumber(areaSqFt)} sq.ft` : '—';

            ppDims.innerHTML = '';
            const dimEls = plotGroup.querySelectorAll('.plot-dim');
            dimEls.forEach((el, i) => {
                const letter = el.getAttribute('data-edge') || String.fromCharCode(65 + i);
                const ft = el.getAttribute('data-length-ft');
                const inch = el.getAttribute('data-length-in');
                const value = (ft !== null && inch !== null)
                    ? `${ft}' ${inch}"`
                    : el.textContent.trim();

                const card = document.createElement('div');
                card.className = 'plot-panel-dim';
                card.innerHTML = `<div class="label">Side ${letter}</div><div class="value">${value}</div>`;
                ppDims.appendChild(card);
            });

            panel.classList.remove('hidden');
        }

        function hidePlotPanel() {
            panel.classList.add('hidden');
        }

        document.getElementById('pp-close').addEventListener('click', () => {
            hidePlotPanel();
            if (activePlotId !== null) {
                const prevGroup = svg.querySelector(`[data-plot="${CSS.escape(activePlotId)}"]`);
                if (prevGroup) {
                    prevGroup.querySelectorAll('.plot-dim, .plot-boundary')
                        .forEach(el => el.classList.remove('active'));
                }
            }
            activePlotId = null;
        });

        // Activates a plot programmatically (used by click handler + search box)
        function activatePlot(plotId) {
            const plotGroup = svg.querySelector(`[data-plot="${CSS.escape(plotId)}"]`);
            if (!plotGroup) return false;

            if (activePlotId !== null) {
                const prevGroup = svg.querySelector(`[data-plot="${CSS.escape(activePlotId)}"]`);
                if (prevGroup) {
                    prevGroup.querySelectorAll('.plot-dim, .plot-boundary')
                        .forEach(el => el.classList.remove('active'));
                }
            }

            plotGroup.querySelectorAll('.plot-dim, .plot-boundary')
                .forEach(el => el.classList.add('active'));
            activePlotId = plotId;
            showPlotPanel(plotId, plotGroup);
            return true;
        }

        // ------------------------------------------------------------------
        // SEARCH BOX
        // ------------------------------------------------------------------
        const searchInput = document.getElementById('plot-search');
        searchInput.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            const query = searchInput.value.trim().toLowerCase();
            if (!query) return;
            const found = activatePlot(query);
            if (!found) {
                searchInput.style.borderColor = '#F97316';
                setTimeout(() => { searchInput.style.borderColor = ''; }, 900);
            }
        });

        // --- Plot activation logic ---
        let activePlotId = null;

        svg.addEventListener('click', e => {
            const plotGroup = e.target.closest('[data-plot]');
            const boundary = e.target.closest('.plot-boundary');
            const plotId = plotGroup ? plotGroup.getAttribute('data-plot') : null;

            if (activePlotId !== null) {
                const prevGroup = svg.querySelector(`[data-plot="${CSS.escape(activePlotId)}"]`);
                if (prevGroup) {
                    prevGroup.querySelectorAll('.plot-dim, .plot-boundary')
                        .forEach(el => el.classList.remove('active'));
                }
            }

            if (boundary && plotId && plotId !== activePlotId) {
                plotGroup.querySelectorAll('.plot-dim, .plot-boundary')
                    .forEach(el => el.classList.add('active'));
                activePlotId = plotId;
                showPlotPanel(plotId, plotGroup);
            } else {
                activePlotId = null;
                hidePlotPanel();
            }
        });
    </script>
